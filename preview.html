<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلامة ترافيل</title>
  <style>
    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: #f7f7f7;
      color: #222;
    }
    header {
      background: #0077b6;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      position: relative;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #023e8a;
    }
    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      background: #0096c7;
    }
    .lang-select {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 6px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 40px;
      text-align: center;
    }
    .service {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    form {
      background: white;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    form input, form textarea, form button {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    form button {
      background: #0077b6;
      color: white;
      border: none;
      cursor: pointer;
    }
    form button:hover {
      background: #0096c7;
    }
    footer {
      background: #023e8a;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <span id="title">🌍 سلامة ترافيل - رحلاتك معانا أسهل</span>
    <select class="lang-select" id="langSelect">
      <option value="ar">🇪🇬 العربية</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="ru">🇷🇺 Русский</option>
    </select>
  </header>

  <nav>
    <a href="#" id="nav-home">الرئيسية</a>
    <a href="#" id="nav-services">خدماتنا</a>
    <a href="#" id="nav-booking">الحجز</a>
    <a href="#" id="nav-contact">تواصل معنا</a>
  </nav>

  <section class="services">
    <div class="service" id="service1">✈️ رحلات خارجية</div>
    <div class="service" id="service2">🚌 رحلات داخلية</div>
    <div class="service" id="service3">🏨 حجز فنادق</div>
    <div class="service" id="service4">🔥 عروض خاصة</div>
  </section>

  <form id="bookingForm">
    <h2 id="form-title">احجز رحلتك الآن</h2>
    <input type="text" id="name" placeholder="الاسم بالكامل" required>
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="tel" id="phone" placeholder="رقم الهاتف" required>
    <textarea id="details" placeholder="تفاصيل الرحلة المطلوبة"></textarea>
    <button type="submit" id="submitBtn">إرسال</button>
  </form>

  <footer id="footer">
    📞 0100000000 | ✉️ info@salamatravel.com  
    <br>© 2025 سلامة ترافيل - جميع الحقوق محفوظة
  </footer>

  <script>
    // الترجمات
    const translations = {
      ar: {
        title: "🌍 سلامة ترافيل - رحلاتك معانا أسهل",
        home: "الرئيسية",
        services: "خدماتنا",
        booking: "الحجز",
        contact: "تواصل معنا",
        service1: "✈️ رحلات خارجية",
        service2: "🚌 رحلات داخلية",
        service3: "🏨 حجز فنادق",
        service4: "🔥 عروض خاصة",
        formTitle: "احجز رحلتك الآن",
        name: "الاسم بالكامل",
        email: "البريد الإلكتروني",
        phone: "رقم الهاتف",
        details: "تفاصيل الرحلة المطلوبة",
        submit: "إرسال",
        footer: "📞 0100000000 | ✉️ info@salamatravel.com  \n© 2025 سلامة ترافيل - جميع الحقوق محفوظة"
      },
      de: {
        title: "🌍 Salama Travel - Reisen leicht gemacht",
        home: "Startseite",
        services: "Unsere Services",
        booking: "Buchung",
        contact: "Kontakt",
        service1: "✈️ Auslandsreisen",
        service2: "🚌 Inlandsreisen",
        service3: "🏨 Hotelbuchungen",
        service4: "🔥 Sonderangebote",
        formTitle: "Jetzt Ihre Reise buchen",
        name: "Vollständiger Name",
        email: "E-Mail",
        phone: "Telefonnummer",
        details: "Reisedetails",
        submit: "Absenden",
        footer: "📞 0100000000 | ✉️ info@salamatravel.com  \n© 2025 Salama Travel - Alle Rechte vorbehalten"
      },
      ru: {
        title: "🌍 Салама Трэвел - Путешествия проще",
        home: "Главная",
        services: "Услуги",
        booking: "Бронирование",
        contact: "Связаться с нами",
        service1: "✈️ Зарубежные поездки",
        service2: "🚌 Внутренние поездки",
        service3: "🏨 Бронирование отелей",
        service4: "🔥 Специальные предложения",
        formTitle: "Забронируйте поездку сейчас",
        name: "Полное имя",
        email: "Электронная почта",
        phone: "Номер телефона",
        details: "Детали поездки",
        submit: "Отправить",
        footer: "📞 0100000000 | ✉️ info@salamatravel.com  \n© 2025 Салама Трэвел - Все права защищены"
      }
    };

    const langSelect = document.getElementById("langSelect");

    function setLanguage(lang) {
      const t = translations[lang];
      document.getElementById("title").textContent = t.title;
      document.getElementById("nav-home").textContent = t.home;
      document.getElementById("nav-services").textContent = t.services;
      document.getElementById("nav-booking").textContent = t.booking;
      document.getElementById("nav-contact").textContent = t.contact;
      document.getElementById("service1").textContent = t.service1;
      document.getElementById("service2").textContent = t.service2;
      document.getElementById("service3").textContent = t.service3;
      document.getElementById("service4").textContent = t.service4;
      document.getElementById("form-title").textContent = t.formTitle;
      document.getElementById("name").placeholder = t.name;
      document.getElementById("email").placeholder = t.email;
      document.getElementById("phone").placeholder = t.phone;
      document.getElementById("details").placeholder = t.details;
      document.getElementById("submitBtn").textContent = t.submit;
      document.getElementById("footer").innerHTML = t.footer.replace("\n", "<br>");
    }

    // تغيير اللغة عند الاختيار
    langSelect.addEventListener("change", (e) => {
      setLanguage(e.target.value);
    });

    // اللغة الافتراضية عربية
    setLanguage("ar");

    // ✅ رسالة تأكيد عند إرسال الفورم
    document.getElementById("bookingForm").addEventListener("submit", function(event){
      event.preventDefault();
      alert("✅ تم إرسال طلب الحجز بنجاح! سنتواصل معك قريباً.");
    });
  </script>

</body>
</html>
